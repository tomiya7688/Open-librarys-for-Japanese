name: C++ library checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  binary-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S Cpp/original/binary_tree -B build/ci -DOLJ_BINARY_TREE_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/ci --parallel 2
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure
